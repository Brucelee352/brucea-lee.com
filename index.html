<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruce Lee — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-indigo:        #4F46E5;
      --color-indigo-dark:   #4338CA;
      --color-indigo-light:  #EEF2FF;
      --color-indigo-muted:  #C7D2FE;
      --color-pill-bg:       #E0E7FF;
      --color-white:         #FFFFFF;
      --color-heading:       #1E1B4B;
      --color-body:          #374151;
      --color-muted:         #6B7280;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #EEF2FF 0%, #FFFFFF 55%, #F5F3FF 100%);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--color-body);
      -webkit-font-smoothing: antialiased;
    }

    /* Render the page content at 87% scale, like zooming the browser out to 87% */
    #root { zoom: 0.87; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Portfolio section: layout and styling adapted from astro-portfolio-theme's Portfolio.astro */
    .pf-section { width: 100%; max-width: 1600px; padding-top: 0.1rem; animation: fadeUp 0.5s ease 0.15s both; }
    .pf-head { text-align: center; margin-bottom: 2rem; }
    .pf-eyebrow { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-indigo); margin-bottom: 0.5rem; }
    .pf-title { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; color: var(--color-heading); letter-spacing: -0.01em; }
    .pf-sub { margin-top: 0.75rem; font-size: 1rem; color: var(--color-muted); }

    .pf-list {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem; align-items: stretch;
    }
    .pf-bar {
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      background: var(--color-white); border: 1px solid var(--color-indigo-muted); border-radius: 0.875rem;
      box-shadow: 0 4px 20px rgba(79,70,229,.08);
      padding: 1.5rem 1.75rem 1.5rem 2rem;
      animation: fadeUp 0.45s ease both; animation-delay: var(--delay);
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease, border-color .3s ease;
    }
    .pf-bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--color); opacity: .55; transition: opacity .3s ease; }
    .pf-bar:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(79,70,229,.18), 0 0 0 1px var(--color); border-color: var(--color); }
    .pf-bar:hover::before { opacity: 1; }

    /* Unwrap the top row so the View button can sit at the bottom of each card */
    .pf-bar-top { display: contents; }
    .pf-bar-main { order: 1; min-width: 0; }
    .pf-flow { order: 2; }
    .pf-bar-top > a { order: 3; align-self: flex-start; margin-top: auto; }
    .pf-badge {
      display: inline-block; padding: 0.20rem 0.6rem; border-radius: 9999px;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--color-pill-bg); color: var(--color-indigo);
      transition: background .2s ease, color .2s ease;
    }
    .pf-bar:hover .pf-badge { background: var(--color); color: #fff; }
    .pf-bar-title { margin-top: 0.50rem; font-size: 1.1rem; font-weight: 800; color: var(--color-heading); }
    .pf-bar-desc { margin-top: 0.4rem; font-size: 0.90rem; line-height: 1.5; color: var(--color-body); max-width: 90ch; text-align: left; }
    .pf-stack { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.75rem; }
    .pf-chip {
      padding: 0.15rem 0.55rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600;
      color: var(--color-muted); border: 1px solid var(--color-indigo-muted); background: #F8FAFF;
    }

    .pf-flow { list-style: none; display: flex; flex-direction: column; align-items: stretch; gap: 0.1rem; margin: 1.1rem 0 1.25rem; padding-top: 1rem; border-top: 1px solid var(--color-indigo-light); }
    .pf-step { min-width: 0; text-align: left; background: var(--color-indigo-light); border-radius: 0.65rem; padding: 0.55rem 0.75rem; }
    .pf-step-name { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-indigo); margin-bottom: 0.2rem; }
    .pf-step-detail { display: block; font-size: 0.78rem; line-height: 1.45; color: var(--color-body); }
    .pf-arrow { align-self: center; flex: none; color: var(--color-indigo-muted); font-size: 0.75rem; font-weight: 700; line-height: 1; transform: rotate(90deg); }

    @media (max-width: 1000px) {
      .pf-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .pf-bar { padding: 1.25rem 1.25rem 1.25rem 1.5rem; }
      .pf-flow { flex-direction: column; }
      .pf-arrow { transform: rotate(90deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, createElement: h } = React;

    const c = {
      accent:        "#4F46E5",
      accentHov:     "#4338CA",
      pillBg:        "#E0E7FF",
      pillText:      "#4F46E5",
      cardBg:        "#FFFFFF",
      cardBorder:    "#C7D2FE",
      heading:       "#1E1B4B",
      body:          "#374151",
      muted:         "#6B7280",
      white:         "#FFFFFF",
    };

    const s = {
      page: {
        minHeight: "100vh",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        padding: "0 1.5rem",
      },
      hero: {
        maxWidth: "680px",
        width: "100%",
        textAlign: "center",
        padding: "2.5rem 0 3rem",
        animation: "fadeUp 0.5s ease both",
      },
      heroName: {
        fontSize: "clamp(2rem, 5vw, 2.5rem)",
        fontWeight: 700,
        color: c.heading,
        letterSpacing: "-0.01em",
        marginBottom: "0.75rem",
      },
      heroTagline: {
        fontSize: "1.125rem",
        color: c.muted,
        lineHeight: 1.7,
      },
      btn: {
        display: "inline-flex",
        alignItems: "center",
        gap: "0.3rem",
        backgroundColor: c.accent,
        color: c.white,
        border: "none",
        borderRadius: "9999px",
        padding: "0.625rem 1.5rem",
        fontSize: "0.9375rem",
        fontWeight: 600,
        cursor: "pointer",
        textDecoration: "none",
        boxShadow: "0 2px 8px rgba(79, 70, 229, 0.25)",
        transition: "background-color 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease",
        flex: "none",
        whiteSpace: "nowrap",
      },
      btnHov: {
        backgroundColor: c.accentHov,
        boxShadow: "0 4px 16px rgba(79, 70, 229, 0.35)",
        transform: "translateY(-1px)",
      },
      footer: {
        marginTop: "3rem",
        marginBottom: "2rem",
        fontSize: "0.8125rem",
        color: "#9CA3AF",
        animation: "fadeUp 0.5s ease 0.3s both",
      },
    };

    const linkStyle = {
      fontSize: "14px",
      color: "#4F46E5",
      display: "flex",
      flexDirection: "row",
      marginBottom: "10px",
      textDecoration: "none",
    };

    function ProjectButton({ href, children }) {
      const [hov, setHov] = useState(false);
      return h('a', {
        href: href,
        style: Object.assign({}, s.btn, hov ? s.btnHov : {}),
        onMouseEnter: () => setHov(true),
        onMouseLeave: () => setHov(false),
      },
        children, ' ',
        h('span', { 'aria-hidden': 'true' }, '→')
      );
    }

    function PipelineFlow({ steps }) {
      const items = [];
      steps.forEach((st, i) => {
        if (i > 0) items.push(h('li', { key: 'arrow' + i, className: 'pf-arrow', 'aria-hidden': 'true' }, '→'));
        items.push(h('li', { key: st.name, className: 'pf-step' },
          h('span', { className: 'pf-step-name' }, st.name),
          h('span', { className: 'pf-step-detail' }, st.detail)
        ));
      });
      return h('ol', { className: 'pf-flow', 'aria-label': 'Pipeline stages' }, items);
    }

    function ProjectBar({ project, index }) {
      return h('article', {
        className: 'pf-bar',
        style: { '--color': categoryColors[project.category] || '#6366f1', '--delay': (index * 0.05) + 's' },
      },
        h('div', { className: 'pf-bar-top' },
          h('div', { className: 'pf-bar-main' },
            h('span', { className: 'pf-badge' }, project.category),
            h('h3', { className: 'pf-bar-title' }, project.title),
            h('p', { className: 'pf-bar-desc' }, project.description),
            project.stack && h('div', { className: 'pf-stack' },
              project.stack.map((t) => h('span', { key: t, className: 'pf-chip' }, t))
            )
          ),
          h(ProjectButton, { href: project.href }, 'View')
        ),
        project.pipeline && h(PipelineFlow, { steps: project.pipeline })
      );
    }

    const categoryColors = {
      "Health Analytics":    "#6366f1",
      "Labor Economics":     "#0ea5e9",
      "Product Analytics":   "#10b981",
      "Job Market Analytics": "#ec4899",
    };

    const projects = [
      {
        category: "Health Analytics",
        title: "Mental Health Dashboard",
        description: "Scores every individual ACA Marketplace plan in twelve Florida counties from 0 to 100 on mental health coverage. The outpatient therapy copay is worth 40 points, the in-network deductible 25, covered mental health benefits 20, and the CMS quality rating 15.",
        stack: ["Python", "DuckDB", "dbt", "Dash", "Cloud Run"],
        pipeline: [
          { name: "Extract",   detail: "Paginated POST /plans/search calls to the CMS Marketplace API, one sweep per county" },
          { name: "Load",      detail: "Six raw tables in DuckDB, plus timestamped CSV snapshots for auditing" },
          { name: "Transform", detail: "dbt staging views, an SCD Type 2 plan snapshot, then dimension and fact tables" },
          { name: "Serve",     detail: "Dash app reads the scored fact tables read-only, served by gunicorn" },
        ],
        href: "https://aca.brucea-lee.com",
      },
      {
        category: "Labor Economics",
        title: "BLS Underemployment Tracker",
        description: "Rebuilds the BLS U-3 through U-6 unemployment rates for every state from 1.2 million CPS person records, January to October 2026. National figures land within 0.01 points of BLS Table A-15. It also measures how many hours involuntary part-timers fall short of full time, and how often workers have more schooling than their occupation usually calls for.",
        stack: ["Python", "DuckDB", "BLS API", "Dash", "Cloud Run"],
        pipeline: [
          { name: "Ingest",   detail: "Ten monthly CPS public-use files, weighted with PWCMPWGT and averaged per month" },
          { name: "Measure",  detail: "U-3 to U-6, the hours gap, and overqualification at one SD above the occupation's mean schooling" },
          { name: "Validate", detail: "Checked against BLS Table A-15 pulled from the BLS Public Data API v2" },
          { name: "Serve",    detail: "A 52-row DuckDB table behind a Dash choropleth and state comparisons" },
        ],
        href: "https://emp.brucea-lee.com",
      },
      {
        category: "Product Analytics",
        title: "Kroger Product Analysis",
        description: "Pulls product, price, and store data from the Kroger Public API for eight grocery categories at stores near ten US zip codes. A full run makes about 165 API calls and takes two to five minutes. The dashboard covers price spread, stock levels, promo discounts, and fulfillment by store.",
        stack: ["Python", "OAuth2", "DuckDB", "dbt", "Dash"],
        pipeline: [
          { name: "Extract",   detail: "OAuth2 token, store lookup by zip code, then product and price fetches per store" },
          { name: "Load",      detail: "Upserts into raw locations, products, and product_prices tables in DuckDB" },
          { name: "Transform", detail: "dbt staging, dimensions, a price fact table, and three mart aggregates" },
          { name: "Serve",     detail: "Five Dash charts built from the marts, including a store map" },
        ],
        href: "https://kro.brucea-lee.com",
      },
      {
        category: "Job Market Analytics",
        title: "Jooble.com Job Listings Dashboard",
        description: "Searches the Jooble API for job listings and reads each snippet for seniority, minimum years of experience, skills, and salary converted to an annual figure. Results go on a US map, five charts, and a sortable table you can email to yourself as a CSV.",
        stack: ["Python", "Dash", "Mantine", "Cloud Run", "Gmail SMTP"],
        pipeline: [
          { name: "Fetch",   detail: "Jooble API search by keyword, location, and remote flag, up to 21 days back" },
          { name: "Parse",   detail: "Seniority, years of experience, about 45 skills, and salary as annual USD" },
          { name: "Geocode", detail: "About 60 major cities, falling back to state centroids" },
          { name: "Serve",   detail: "Dash app on Cloud Run with the API key in Secret Manager; CSVs mailed over SMTP" },
        ],
        href: "https://jooble.brucea-lee.com",
      },
    ];

    function Portfolio() {
      return h('section', { id: 'portfolio', className: 'pf-section' },
        h('div', { className: 'pf-head' },
          h('p', { className: 'pf-eyebrow' }, 'Analytics Engineering'),
          h('h2', { className: 'pf-title' }, 'Portfolio'),
          h('p', { className: 'pf-sub' }, 'Each project runs from a public API or dataset to a live dashboard.')
        ),
        h('div', { className: 'pf-list' },
          projects.map((p, i) => h(ProjectBar, { key: p.title, project: p, index: i }))
        )
      );
    }

    function App() {
      return h('div', { style: s.page },
        h('header', { style: s.hero },
          h('h1', { style: s.heroName }, 'Bruce A. Lee'),
          h('hr', { style: { margin: "14px 0", border: "none", borderTop: "1px solid #C7D2FE" } }),
          h('p', { style: { fontWeight: 600, fontSize: "18px", color: "#1E1B4B", marginBottom: "12px" } }, 'Connect:'),
          h('div', { style: { display: "flex", gap: "2rem", justifyContent: "center" } },
            h('div', null,
              h('a', { href: "https://github.com/brucelee352", target: "_blank", rel: "noopener noreferrer", style: linkStyle }, 'GitHub'),
              h('a', { href: "https://linkedin.com/in/brucealee", target: "_blank", rel: "noopener noreferrer", style: linkStyle }, 'LinkedIn')
            ),
            h('div', null,
              h('a', { href: "https://github.com/Brucelee352/brucea-lee.com/blob/main/BruceLee_2026Resume_h.pdf", target: "_blank", rel: "noopener noreferrer", style: linkStyle }, 'Resume'),
              h('a', { href: "mailto:brucelee352@gmail.com", style: linkStyle }, 'Email')
            )
          )
        ),
        h('main', { style: { width: "100%", display: "flex", justifyContent: "center" } },
          h(Portfolio, null)
        ),
        h('footer', { style: s.footer },
          '© ' + new Date().getFullYear() + ' Bruce Lee'
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
  </script>
</body>
</html>
